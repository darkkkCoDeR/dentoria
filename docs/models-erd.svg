<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Dentoria LMS readable model relationship diagram</title>
  <desc id="desc">Readable grouped entity relationship diagram for Dentoria Django models with non-overlapping relationship lines.</desc>
  <defs>
    <style>
      .bg{fill:#fff7ed}.group{fill:#ffffff;stroke:#fed7aa;stroke-width:2}.entity{fill:#fff;stroke:#fdba74;stroke-width:2}.core{fill:#ffedd5;stroke:#f97316;stroke-width:2.5}.title{font:800 17px Arial,sans-serif;fill:#9a3412}.field{font:12.5px Arial,sans-serif;fill:#374151}.label{font:800 14px Arial,sans-serif;fill:#c2410c}.caption{font:13px Arial,sans-serif;fill:#64748b}.heading{font:900 34px Arial,sans-serif;fill:#9a3412}.subtitle{font:15px Arial,sans-serif;fill:#64748b}.line{stroke:#ea580c;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.line2{stroke:#64748b;stroke-width:1.9;fill:none;marker-end:url(#arrow2)}.dash{stroke-dasharray:7 7}.key{font:700 12px Arial,sans-serif;fill:#9a3412}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>

  <rect width="1600" height="1180" rx="30" class="bg"/>
  <text x="60" y="60" class="heading">Dentoria LMS — читабельна схема моделей</text>
  <text x="60" y="88" class="subtitle">Звʼязки згруповані за доменами: акаунти, курси, тести, контент, календар і прогрес.</text>

  <rect x="40" y="115" width="320" height="1010" rx="26" class="group"/>
  <text x="65" y="148" class="label">Accounts</text>
  <rect x="80" y="185" width="240" height="150" rx="16" class="core"/>
  <text x="105" y="218" class="title">User</text>
  <text x="105" y="248" class="field">id PK</text><text x="105" y="270" class="field">username, email</text><text x="105" y="292" class="field">password, is_active</text><text x="105" y="314" class="field">is_staff, date_joined</text>
  <rect x="80" y="405" width="240" height="140" rx="16" class="entity"/>
  <text x="105" y="438" class="title">Profile</text>
  <text x="105" y="468" class="field">user FK one-to-one</text><text x="105" y="490" class="field">avatar_url, bio</text><text x="105" y="512" class="field">specialization, theme</text>
  <text x="80" y="1035" class="caption">User є центральною моделлю.</text>
  <text x="80" y="1057" class="caption">Усі авторські сутності мають FK на User.</text>

  <rect x="420" y="115" width="390" height="1010" rx="26" class="group"/>
  <text x="445" y="148" class="label">Courses and progress</text>
  <rect x="475" y="185" width="280" height="170" rx="16" class="core"/>
  <text x="500" y="218" class="title">Course</text>
  <text x="500" y="248" class="field">author FK → User</text><text x="500" y="270" class="field">title, slug, description</text><text x="500" y="292" class="field">cover_image_url</text><text x="500" y="314" class="field">status, published_at</text>
  <rect x="475" y="430" width="280" height="150" rx="16" class="entity"/>
  <text x="500" y="463" class="title">CourseMaterial</text>
  <text x="500" y="493" class="field">course FK → Course</text><text x="500" y="515" class="field">material_type</text><text x="500" y="537" class="field">text/file/image/link/video URLs</text>
  <rect x="475" y="655" width="280" height="135" rx="16" class="entity"/>
  <text x="500" y="688" class="title">CourseEnrollment</text>
  <text x="500" y="718" class="field">user FK → User</text><text x="500" y="740" class="field">course FK → Course</text><text x="500" y="762" class="field">progress, status</text>
  <rect x="475" y="865" width="280" height="135" rx="16" class="entity"/>
  <text x="500" y="898" class="title">MaterialProgress</text>
  <text x="500" y="928" class="field">user FK → User</text><text x="500" y="950" class="field">material FK → CourseMaterial</text><text x="500" y="972" class="field">is_completed, completed_at</text>

  <rect x="870" y="115" width="320" height="620" rx="26" class="group"/>
  <text x="895" y="148" class="label">Tests</text>
  <rect x="910" y="185" width="240" height="120" rx="16" class="entity"/>
  <text x="935" y="218" class="title">Test</text>
  <text x="935" y="248" class="field">course FK → Course</text><text x="935" y="270" class="field">title, passing_score</text>
  <rect x="910" y="370" width="240" height="110" rx="16" class="entity"/>
  <text x="935" y="403" class="title">Question</text>
  <text x="935" y="433" class="field">test FK → Test</text><text x="935" y="455" class="field">text, order</text>
  <rect x="910" y="545" width="240" height="110" rx="16" class="entity"/>
  <text x="935" y="578" class="title">AnswerOption</text>
  <text x="935" y="608" class="field">question FK → Question</text><text x="935" y="630" class="field">text, is_correct</text>
  <rect x="870" y="795" width="320" height="205" rx="26" class="group"/>
  <text x="895" y="828" class="label">Attempts</text>
  <rect x="910" y="865" width="240" height="115" rx="16" class="entity"/>
  <text x="935" y="898" class="title">TestAttempt</text>
  <text x="935" y="928" class="field">user FK → User</text><text x="935" y="950" class="field">test FK → Test</text><text x="935" y="972" class="field">score, passed</text>

  <rect x="1250" y="115" width="310" height="1010" rx="26" class="group"/>
  <text x="1275" y="148" class="label">Community and calendar</text>
  <rect x="1285" y="185" width="240" height="135" rx="16" class="entity"/>
  <text x="1310" y="218" class="title">JobVacancy</text>
  <text x="1310" y="248" class="field">author FK → User</text><text x="1310" y="270" class="field">clinic, city, descriptions</text><text x="1310" y="292" class="field">contact_info, is_active</text>
  <rect x="1285" y="385" width="240" height="115" rx="16" class="entity"/>
  <text x="1310" y="418" class="title">UserPost</text>
  <text x="1310" y="448" class="field">author FK → User</text><text x="1310" y="470" class="field">title, content, image_url</text>
  <rect x="1285" y="565" width="240" height="115" rx="16" class="entity"/>
  <text x="1310" y="598" class="title">InternshipPost</text>
  <text x="1310" y="628" class="field">author FK → User</text><text x="1310" y="650" class="field">title, content, image_url</text>
  <rect x="1285" y="745" width="240" height="110" rx="16" class="entity"/>
  <text x="1310" y="778" class="title">InternshipVote</text>
  <text x="1310" y="808" class="field">post FK, user FK</text><text x="1310" y="830" class="field">vote_type</text>
  <rect x="1285" y="905" width="240" height="105" rx="16" class="entity"/>
  <text x="1310" y="938" class="title">Comment</text>
  <text x="1310" y="968" class="field">author FK</text><text x="1310" y="990" class="field">post FK or internship FK</text>
  <rect x="1285" y="1040" width="240" height="70" rx="16" class="entity"/>
  <text x="1310" y="1073" class="title">CalendarEvent</text>
  <text x="1310" y="1098" class="field">author FK, related_course FK</text>

  <text x="70" y="1145" class="key">Легенда:</text>
  <line x1="145" y1="1141" x2="195" y2="1141" class="line"/><text x="205" y="1146" class="caption">звʼязок від User/основної моделі</text>
  <line x1="435" y1="1141" x2="485" y2="1141" class="line2"/><text x="495" y="1146" class="caption">внутрішній доменний звʼязок</text>

  <!-- Local non-overlapping links inside groups -->
  <path class="line" d="M200 335 L200 405"/><text x="213" y="377" class="caption">1:1</text>
  <path class="line2" d="M615 355 L615 430"/><text x="628" y="399" class="caption">has materials</text>
  <path class="line2" d="M615 355 L615 655"/><text x="628" y="612" class="caption">enrollments</text>
  <path class="line2" d="M615 580 L615 865"/><text x="628" y="825" class="caption">progress</text>
  <path class="line2" d="M1030 305 L1030 370"/><text x="1043" y="344" class="caption">questions</text>
  <path class="line2" d="M1030 480 L1030 545"/><text x="1043" y="520" class="caption">answers</text>
  <path class="line2" d="M1030 655 L1030 865"/><text x="1043" y="770" class="caption">attempted</text>
  <path class="line2" d="M1405 680 L1405 745"/><text x="1418" y="720" class="caption">votes</text>
  <path class="line2" d="M1405 500 L1405 905"/><text x="1418" y="890" class="caption">comments</text>
  <path class="line2" d="M1465 680 L1465 905"/><text x="1478" y="870" class="caption">comments</text>

  <!-- Cross-domain links routed through clean corridors -->
  <path class="line" d="M320 235 H475"/><text x="363" y="224" class="caption">author</text>
  <path class="line" d="M320 255 H435 V720 H475"/><text x="338" y="710" class="caption">user</text>
  <path class="line" d="M320 275 H410 V930 H475"/><text x="338" y="920" class="caption">user</text>
  <path class="line" d="M320 295 H385 V922 H910"/><text x="512" y="910" class="caption">user attempts</text>

  <path class="line2" d="M755 245 H910"/><text x="800" y="234" class="caption">course tests</text>
  <path class="line2" d="M755 720 H825 V445 H910"/><text x="768" y="710" class="caption">course</text>
  <path class="line2" d="M755 250 H830 V1075 H1285"/><text x="850" y="1062" class="caption">related_course</text>

  <path class="line" d="M320 215 H1210 V250 H1285"/><text x="1160" y="238" class="caption">author</text>
  <path class="line" d="M320 225 H1200 V442 H1285"/><text x="1160" y="430" class="caption">author</text>
  <path class="line" d="M320 245 H1190 V622 H1285"/><text x="1160" y="610" class="caption">author</text>
  <path class="line" d="M320 265 H1180 V800 H1285"/><text x="1160" y="790" class="caption">user</text>
  <path class="line" d="M320 285 H1170 V958 H1285"/><text x="1160" y="947" class="caption">author</text>
  <path class="line" d="M320 305 H1160 V1075 H1285"/><text x="1160" y="1064" class="caption">author</text>
</svg>
