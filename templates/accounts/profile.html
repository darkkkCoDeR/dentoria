{% extends 'base.html' %}{% block content %}<h1>Профіль</h1><div class="card card-body"><h3>{{ user.get_full_name|default:user.username }}</h3><p>{{ user.email }}</p><p>{{ user.profile.specialization }}</p><p>{{ user.profile.bio }}</p>{% if user.profile.avatar_url %}<img src="{{ user.profile.avatar_url }}" class="rounded" style="max-width:160px">{% endif %}<p class="mt-3">Тема: {{ user.profile.get_theme_display }}</p><a class="btn btn-primary" href="{% url 'profile_edit' %}">Редагувати</a></div>{% endblock %}
