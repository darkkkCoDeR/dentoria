{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>Вакансії</h1><a class="btn btn-primary" href="{% url 'job_create' %}">Додати вакансію</a></div><div class="row g-3 mt-1">{% for job in jobs %}<div class="col-md-6"><div class="card card-body h-100"><h4>{{ job.title }}</h4><p class="text-muted">{{ job.clinic_name }} · {{ job.city }}</p><p>{{ job.short_description }}</p><a href="{% url 'job_detail' job.pk %}" class="btn btn-primary btn-sm">Деталі</a></div></div>{% empty %}<p>Вакансій поки немає.</p>{% endfor %}</div>{% endblock %}
