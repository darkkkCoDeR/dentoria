{% extends 'base.html' %}{% block content %}<h1>{{ post.title }}</h1><div class="card card-body">{% if post.image_url %}<img src="{{ post.image_url }}" class="img-fluid rounded mb-3">{% endif %}<p>{{ post.content }}</p><p class="text-muted">Автор: {{ post.author }}</p>{% if post.author == user or user.is_staff %}<a class="btn btn-outline-primary" href="{% url 'internship_edit' post.pk %}">Редагувати</a>{% endif %}</div>{% endblock %}
