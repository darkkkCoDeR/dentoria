{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>Пости</h1><a class="btn btn-primary" href="{% url 'post_create' %}">Додати пост</a></div><div class="row g-3 mt-1">{% for post in posts %}<div class="col-md-6"><div class="card card-body h-100"><h4><a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a></h4><p>{{ post.content|truncatewords:30 }}</p><small>Автор: {{ post.author }}</small></div></div>{% empty %}<p>Постів поки немає.</p>{% endfor %}</div>{% endblock %}
