{% extends 'base.html' %}{% block content %}<h1>Мої курси</h1><a class="btn btn-primary mb-3" href="{% url 'course_create' %}">Новий курс</a><div class="list-group">{% for course in courses %}<a class="list-group-item list-group-item-action" href="{% url 'course_detail' course.slug %}">{{ course.title }} <span class="badge text-bg-secondary">{{ course.get_status_display }}</span></a>{% empty %}<p>Ви ще не створили курсів.</p>{% endfor %}</div>{% endblock %}
