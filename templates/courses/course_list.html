{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>Курси</h1><div><a class="btn btn-outline-primary" href="{% url 'my_courses' %}">Мої курси</a> <a class="btn btn-primary" href="{% url 'course_create' %}">Створити</a></div></div><div class="row g-3 mt-1">{% for course in courses %}<div class="col-md-4"><div class="card h-100">{% if course.cover_image_url %}<img src="{{ course.cover_image_url }}" class="card-img-top">{% endif %}<div class="card-body"><h5>{{ course.title }}</h5><p>{{ course.description|truncatewords:22 }}</p><a href="{% url 'course_detail' course.slug %}" class="btn btn-primary btn-sm">Відкрити</a></div></div></div>{% empty %}<p>Курсів поки немає.</p>{% endfor %}</div>{% endblock %}
