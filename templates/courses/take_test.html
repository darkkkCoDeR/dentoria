{% extends 'base.html' %}{% block content %}<h1>{{ test.title }}</h1><form method="post" class="card card-body">{% csrf_token %}{% for question in test.questions.all %}<div class="mb-3"><h5>{{ question.text }}</h5>{% for answer in question.answers.all %}<label class="d-block"><input type="checkbox" name="question_{{ question.id }}" value="{{ answer.id }}"> {{ answer.text }}</label>{% endfor %}</div>{% empty %}<p>У тесті ще немає питань.</p>{% endfor %}<button class="btn btn-primary">Завершити тест</button></form>{% endblock %}
