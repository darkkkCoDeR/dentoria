{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>Інтернатура</h1><a class="btn btn-primary" href="{% url 'internship_create' %}">Додати пост</a></div><div class="list-group mt-3">{% for post in posts %}<div class="list-group-item"><div class="d-flex justify-content-between"><h4><a href="{% url 'internship_detail' post.pk %}">{{ post.title }}</a></h4><span class="badge text-bg-warning">Рейтинг {{ post.rating_value }}</span></div><p>{{ post.content|truncatewords:35 }}</p><a class="btn btn-sm btn-outline-success" href="{% url 'internship_vote' post.pk 'plus' %}">+ плюс</a> <a class="btn btn-sm btn-outline-danger" href="{% url 'internship_vote' post.pk 'minus' %}">- мінус</a></div>{% empty %}<p>Постів поки немає.</p>{% endfor %}</div>{% endblock %}
